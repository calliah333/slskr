# slskr.toml: optional settings you want to keep in a file.
#
# Most settings live in the web UI (System -> Settings) and are saved to settings.json in
# the data directory. Anything set here, or with an SLSKR_<SECTION>_<KEY> environment
# variable, overrides the UI and is shown there as locked. Leave a key out to manage it
# from the UI. Every key is listed in docs/CONFIGURATION.md.
#
# Copy this file to <data_dir>/slskr.toml (default ~/.local/share/slskr) and uncomment
# what you need. Unknown keys are errors. Relative paths resolve against the data
# directory. Keys marked "restart" apply on the next start; the rest apply on save.

[web]
# Address of the web UI and API (restart).
listen = "127.0.0.1:5031"
# Path prefix behind a reverse proxy, e.g. "/slskr" (restart). slskr serves plain HTTP:
# terminate TLS at the proxy, send X-Forwarded-Proto: https and keep the original Host.
# url_base = "/"
# false disables sign-in entirely: loopback or development only (restart).
# auth = true

[downloads]
# directory = "downloads"
# incomplete_directory = "incomplete"

[logging]
# trace | debug | info | warn | error; RUST_LOG takes precedence (restart).
# level = "info"

[metrics]
# Prometheus metrics at `path`; basic auth when username and password are set (restart).
# enabled = false
# path = "/metrics"
# username = ""
# password = ""

[soulseek]
# false starts without connecting to the server, like --no-connect (restart).
# connect = true
# Port for incoming peer connections (1024-65535); forward it on your router.
# listen_port = 50300
