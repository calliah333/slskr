[workspace]
resolver = "3"
members = ["crates/soulseek", "crates/slskr-types", "crates/slskr", "crates/slskr-web"]
default-members = ["crates/soulseek", "crates/slskr-types", "crates/slskr"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
soulseek = { path = "crates/soulseek" }
slskr-types = { path = "crates/slskr-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
bytes = "1"

[profile.release]
lto = "thin"

[profile.release.package.slskr-web]
opt-level = "z"

# Password hashing is deliberately expensive; unoptimized it makes sign-in and tests slow.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# build.rs compresses the embedded web UI; build scripts are otherwise unoptimized.
[profile.dev.package.brotli]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release.package.brotli]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3
