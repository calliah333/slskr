<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>slskr</title>
    <base href="/" />
    <script>
      // Apply the saved theme (light, dark or system; default system) before the first
      // paint. Same key as src/ui/theme.rs.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("slskr-theme"); } catch (e) {}
        var dark = theme === "dark" ||
          (theme !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <link data-trunk rel="icon" href="assets/favicon.svg" />
    <link data-trunk rel="css" href="assets/static/css/app.css" data-target-path="static/css" />
    <link data-trunk rel="css" href="assets/static/css/pages/browse.css" data-target-path="static/css" />
    <link data-trunk rel="css" href="assets/static/css/pages/chat.css" data-target-path="static/css" />
    <link data-trunk rel="css" href="assets/static/css/pages/search.css" data-target-path="static/css" />
    <link data-trunk rel="css" href="assets/static/css/pages/settings.css" data-target-path="static/css" />
    <link data-trunk rel="css" href="assets/static/css/pages/system.css" data-target-path="static/css" />
    <link data-trunk rel="css" href="assets/static/css/pages/transfers.css" data-target-path="static/css" />
    <link data-trunk rel="copy-file" href="../../LICENSE" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
