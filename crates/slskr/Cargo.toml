[package]
name = "slskr"
description = "Soulseek client daemon with a web UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
soulseek.workspace = true
slskr-api.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["clock"] }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
bytes.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "limits"] }
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
walkdir = "2"
lofty = { version = "0.22", default-features = false }
futures = "0.3"
tokio-util = "0.7"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
cap-std = "3"
cap-fs-ext = "3"
openssl = "0.10"
tokio-openssl = "0.6"
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
