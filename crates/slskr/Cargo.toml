[package]
name = "slskr"
description = "Soulseek client daemon with a web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
soulseek.workspace = true
slskr-types.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["clock"] }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
bytes.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "decompression-gzip", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
rusqlite = { version = "0.37", features = ["bundled", "limits"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
walkdir = "2"
lofty = { version = "0.22", default-features = false }
futures = "0.3"
tokio-util = "0.7"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
cap-std = "3"
cap-fs-ext = "3"

[dev-dependencies]
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio-tungstenite = "0.29"

[build-dependencies]
brotli = "8"
flate2 = "1"
sha2 = "0.10"
